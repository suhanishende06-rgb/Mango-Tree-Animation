<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mango Tree Animation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sky"></div>

<div class="scene">

  <div class="sun"></div>

  <div class="tree">

    <div class="leaves">

      <div class="mango m1"></div>
      <div class="mango m2"></div>
      <div class="mango m3"></div>
      <div class="mango m4"></div>
      <div class="mango m5"></div>
      <div class="mango m6"></div>

    </div>

    <div class="trunk"></div>

  </div>

  <div class="child left-child">
      <div class="head"></div>
      <div class="body"></div>
      <div class="arm left-arm"></div>
      <div class="arm right-arm"></div>
      <div class="leg left-leg"></div>
      <div class="leg right-leg"></div>
  </div>

  <div class="child right-child">
      <div class="stick"></div>
      <div class="head"></div>
      <div class="body blue"></div>
      <div class="arm left-arm"></div>
      <div class="arm right-arm"></div>
      <div class="leg left-leg"></div>
      <div class="leg right-leg"></div>
  </div>

  <div class="leaf leaf1"></div>
  <div class="leaf leaf2"></div>
  <div class="leaf leaf3"></div>
  <div class="leaf leaf4"></div>

  <div class="ground"></div>

</div>

<script src="script.js"></script>
</body>
    </html>
